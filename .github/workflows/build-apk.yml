name: Build Android APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize Bubblewrap (TwA)
      run: |
        # This creates the Android project files based on a dummy URL.
        # We'll replace the dummy URL with our local index.html later.
        echo '{"packageId":"com.belayapple.timesheet","host":"https://example.com","name":"Machinery Timesheet","launcherName":"Timesheet","webManifestUrl":"https://example.com/manifest.json"}' > twa-manifest.json
        bubblewrap init --manifest=./twa-manifest.json --directory=./twa-project --skipPwaValidation

    - name: Replace with our local web app
      run: |
        # Copy our index.html into the generated Android assets
        cp index.html twa-project/app/src/main/res/raw/index.html || true

    - name: Build APK
      run: |
        cd twa-project
        bubblewrap build --skipPwaValidation

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: machinery-timesheet-apk
        path: twa-project/app-release-signed.apk
